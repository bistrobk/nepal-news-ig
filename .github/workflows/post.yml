name: Post to Instagram

on:
  schedule:
    # GitHub runs these late (often hours) and drops some, so we wake often and
    # bot/when.py decides from the Nepal clock: one post per hour 06:00-21:00,
    # Reels at 08, 18 and 21, the 'Today in Nepal' summary after 20:30, nothing at night.
    # 00:05-16:45 UTC = 05:50-22:30 Nepal time. Avoids :00, GitHub's busiest minute.
    - cron: '5,25,45 0-16 * * *'
  # Backup wake-up that does not depend on GitHub's timer: a Claude cloud
  # scheduled task pushes an empty commit to this branch every hour.
  push:
    branches: ['claude/tick']
  workflow_dispatch:
    inputs:
      reel:
        description: 'Make a Reel instead of a card'
        type: boolean
        default: false
      digest:
        description: 'Post the daily summary'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_HANDLE: ${{ vars.IG_HANDLE }}
      IG_BRAND: ${{ vars.IG_BRAND }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # latest commit, so a queued run sees the newest post log; tick pushes post from main
          ref: ${{ github.event_name == 'push' && 'main' || github.ref_name }}

      - name: Decide what to post
        id: when
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # manual run: always post, as asked
            if [ "${{ inputs.digest }}" = "true" ]; then a=digest
            elif [ "${{ inputs.reel }}" = "true" ]; then a=reel
            else a=card; fi
            echo "action=$a" >> "$GITHUB_OUTPUT"; echo "$a: manual run"
          else
            python3 -m bot.when
          fi

      - name: Install system libraries
        if: steps.when.outputs.action != 'skip'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0

      - uses: actions/setup-python@v5
        if: steps.when.outputs.action != 'skip'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packages
        if: steps.when.outputs.action != 'skip'
        run: pip install -r requirements.txt

      - name: Git identity
        if: steps.when.outputs.action != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare post
        if: steps.when.outputs.action != 'skip'
        run: |
          case "${{ steps.when.outputs.action }}" in
            digest) python -m bot.main digest ;;
            reel)   python -m bot.main prepare --reel ;;
            *)      python -m bot.main prepare ;;
          esac

      - name: Upload media (so Instagram can fetch it)
        if: steps.when.outputs.action != 'skip'
        run: |
          git add media state
          if git diff --cached --quiet; then echo "Nothing to upload"; exit 0; fi
          git commit -q -m "media: $(TZ=Asia/Kathmandu date +%Y%m%d-%H%M)"
          git pull -q --rebase && git push -q
          sleep 20

      - name: Publish
        if: steps.when.outputs.action != 'skip'
        run: python -m bot.main publish

      - name: Clean old media
        if: always() && steps.when.outputs.action != 'skip'
        run: python -m bot.main cleanup

      - name: Save state
        if: always() && steps.when.outputs.action != 'skip'
        run: |
          git add -A media state
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "state: $(TZ=Asia/Kathmandu date +%Y%m%d-%H%M)"
          git pull -q --rebase && git push -q
