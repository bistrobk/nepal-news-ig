name: Post to Instagram

on:
  schedule:
    # UTC times. Nepal = UTC+5:45. One post every hour, 06:00-21:00 Nepal time (16 a day).
    # Reels at 08:00, 18:00 and 21:00 Nepal time. Daily summary at 20:30 Nepal time (14:45 UTC).
    - cron: '15 0 * * *'
    - cron: '15 1 * * *'
    - cron: '15 2 * * *'
    - cron: '15 3 * * *'
    - cron: '15 4 * * *'
    - cron: '15 5 * * *'
    - cron: '15 6 * * *'
    - cron: '15 7 * * *'
    - cron: '15 8 * * *'
    - cron: '15 9 * * *'
    - cron: '15 10 * * *'
    - cron: '15 11 * * *'
    - cron: '15 12 * * *'
    - cron: '15 13 * * *'
    - cron: '15 14 * * *'
    - cron: '15 15 * * *'
    - cron: '45 14 * * *'
  workflow_dispatch:
    inputs:
      reel:
        description: 'Make a Reel instead of a card'
        type: boolean
        default: false
      digest:
        description: 'Post the daily summary'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_HANDLE: ${{ vars.IG_HANDLE }}
      IG_BRAND: ${{ vars.IG_BRAND }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      REEL: ${{ (github.event.schedule == '15 2 * * *' || github.event.schedule == '15 12 * * *' || github.event.schedule == '15 15 * * *' || inputs.reel) && '--reel' || '' }}
      DIGEST: ${{ (github.event.schedule == '45 14 * * *' || inputs.digest) && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare post
        run: |
          if [ -n "$DIGEST" ]; then python -m bot.main digest; else python -m bot.main prepare $REEL; fi

      - name: Upload media (so Instagram can fetch it)
        run: |
          git add media state
          if git diff --cached --quiet; then echo "Nothing to upload"; exit 0; fi
          git commit -q -m "media: $(date -u +%Y%m%d-%H%M)"
          git pull -q --rebase && git push -q
          sleep 20

      - name: Publish
        run: python -m bot.main publish

      - name: Clean old media
        if: always()
        run: python -m bot.main cleanup

      - name: Save state
        if: always()
        run: |
          git add -A media state
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "state: $(date -u +%Y%m%d-%H%M)"
          git pull -q --rebase && git push -q
