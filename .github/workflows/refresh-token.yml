name: Refresh Instagram token

on:
  schedule:
    - cron: '30 3 * * 1'   # Mondays 03:30 UTC (token lasts 60 days)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Refresh token
        run: python -m bot.main refresh

      - name: Save new token as a secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_ACCESS_TOKEN < new_token.txt
          rm new_token.txt
